name: Build Android APK
# Trigger Android APK Build Workflow

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  buildAndroid:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Clean workspace
      - name: Clean workspace cache
        run: |
          rm -rf Library Temp Logs obj

      # 3. Check Unity License Secret Configuration
      - name: Check Unity License configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_EMAIL" ]; then
            echo "::error::UNITY_LICENSE secret is not configured in GitHub Repository Settings!"
            echo "::error::Please follow SETUP_GUIDE.md to generate your free Unity License (.ulf) file and add UNITY_LICENSE in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # 4. Build Unity Project for Android
      - name: Build Unity Project (Android)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.20f1
          buildName: Game1-Android
          androidTargetSdkVersion: AndroidApiLevel33
          androidExportType: androidPackage
          customParameters: -nographics

      # 5. Upload APK artifact for download
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game1-Android-APK
          path: build/Android/Game1-Android.apk
          if-no-files-found: error
