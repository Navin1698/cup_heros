name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  buildAndroid:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Clean any stale build or library caches
      - name: Clean workspace cache
        run: |
          rm -rf Library Temp Logs obj

      # 3. Build Unity Project for Android
      - name: Build Unity Project (Android)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2022.3.20f1
          buildName: Game1-Android
          androidTargetSdkVersion: Android33
          androidExportType: androidPackage
          customParameters: -nographics

      # 4. Upload APK artifact for download
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game1-Android-APK
          path: build/Android/Game1-Android.apk
          if-no-files-found: error
