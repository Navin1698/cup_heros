name: Build Android APK 📱

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  buildAndroid:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository with LFS support
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # 2. Cache Unity Library folder for faster builds
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # 3. Build Unity Project for Android
      - name: Build Unity Project (Android)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: Game1-Android
          androidTargetSdkVersion: Android33

      # 4. Upload APK artifact for download
      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Game1-Android-APK
          path: build/Android/Game1-Android.apk
          if-no-files-found: error
