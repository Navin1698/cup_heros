name: Build WebGL (Play in Browser)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  buildWebGL:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Clean workspace
      - name: Clean workspace cache
        run: |
          rm -rf Library Temp Logs obj

      # 3. Check Unity License Configuration
      - name: Check Unity License configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_EMAIL" ]; then
            echo "::error::UNITY_LICENSE secret is not configured in GitHub Repository Settings!"
            exit 1
          fi

      # 4. Build Unity Project for WebGL
      - name: Build Unity Project (WebGL)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: 2022.3.20f1
          buildMethod: BuildScript.BuildWebGL
          buildName: Game1-WebGL

      # 5. Upload WebGL Artifact for instant browser testing
      - name: Upload WebGL Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Game1-WebGL-Browser
          path: build/WebGL
          if-no-files-found: ignore
